packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "bcrypt"
  - "prisma"
  - "sharp"
  - "unrs-resolver"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  bcrypt: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  deepmerge-ts: ^8.0.0
  fast-uri@^3: ^3.1.6
  js-yaml@^4: ^4.3.2
  multer@^2: ^2.4.0
  postcss: ^8.5.26
  qs: ^6.16.0
  sharp: ^0.35.4
