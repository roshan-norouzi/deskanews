name: Build and deploy DESKA

on:
  workflow_dispatch:

# A running production deployment is never interrupted by a newer click.
concurrency:
  group: deska-production-deploy
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/roshan-norouzi/deskanews

jobs:
  prepare:
    name: Validate release
    # Pinned so a GitHub runner image upgrade can never change deploy behaviour unannounced.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate version
        id: release
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(sed '1s/^\xEF\xBB\xBF//' VERSION | tr -d '[:space:]')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "DESKA_DEPLOY_ERROR: VERSION must use x.y.z format (found '${version}')."
            exit 1
          fi
          if [ "$REF_TYPE" = 'tag' ] && [ "$REF_NAME" != "v${version}" ]; then
            echo "DESKA_DEPLOY_ERROR: tag ${REF_NAME} does not match VERSION ${version}."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DESKA_DEPLOY_STAGE: releasing ${version} from ${REF_TYPE} ${REF_NAME} (${GITHUB_SHA})"

  preflight-server:
    name: Verify server access
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate server configuration
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY DEPLOY_PATH SERVER_PORT; do
            if [ -z "${!name}" ]; then
              echo "DESKA_DEPLOY_ERROR: missing required GitHub secret ${name}."
              exit 1
            fi
          done

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Install server host key
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" |
            bash deploy/prepare-known-hosts.sh "$SERVER_HOST" "$SERVER_PORT" "$HOME/.ssh/known_hosts"

      - name: Verify server prerequisites
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if printf '%s\n' "$DEPLOY_PATH" |
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" '
                IFS= read -r deploy_path
                if [ -z "$deploy_path" ] || [ "$deploy_path" = "/" ] || [ ! -d "$deploy_path" ]; then
                  echo "DESKA_DEPLOY_ERROR: DEPLOY_PATH does not exist or is unsafe on the server."
                  exit 3
                fi
                if [ ! -w "$deploy_path" ]; then echo "DESKA_DEPLOY_ERROR: SERVER_USER cannot write to DEPLOY_PATH."; exit 3; fi
                if [ ! -f "$deploy_path/.env" ]; then echo "DESKA_DEPLOY_ERROR: server .env is missing at DEPLOY_PATH."; exit 3; fi
                for command_name in docker curl openssl sha256sum timeout tar; do
                  if ! command -v "$command_name" >/dev/null 2>&1; then
                    echo "DESKA_DEPLOY_ERROR: required server command is unavailable: ${command_name}."
                    exit 3
                  fi
                done
                if ! docker compose version >/dev/null 2>&1; then echo "DESKA_DEPLOY_ERROR: Docker Compose plugin is unavailable to SERVER_USER."; exit 3; fi
                echo "DESKA_DEPLOY_STAGE: server prerequisites verified."
              '; then
              exit 0
            else
              code=$?
            fi
            # Exit 3 is a real configuration problem; anything else is a connection problem worth retrying.
            if [ "$code" -eq 3 ]; then exit 1; fi
            echo "DESKA_DEPLOY_STAGE: SSH connection failed (attempt ${attempt}/3, exit ${code}); retrying..."
            sleep $((attempt * 15))
          done
          echo 'DESKA_DEPLOY_ERROR: could not connect to the server over SSH after 3 attempts.'
          exit 1

  build-images:
    name: Build and push ${{ matrix.component }}
    needs: [prepare, preflight-server]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - component: API
            image: api
            dockerfile: apps/api/Dockerfile
            cache_scope: deska-api
            build_args: ''
          - component: Web
            image: web
            dockerfile: apps/web/Dockerfile
            cache_scope: deska-web
            build_args: |-
              API_URL=http://api:3001
              NEXT_PUBLIC_BASE_PATH=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable image
        id: image_build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: |-
            ${{ matrix.build_args }}
            NEXT_PUBLIC_APP_VERSION=${{ env.VERSION }}
          tags: |-
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: false

      # Registry and runner network failures are usually transient. A second
      # attempt reuses the BuildKit cache and therefore finishes quickly.
      - name: Retry build and push immutable image
        if: steps.image_build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: |-
            ${{ matrix.build_args }}
            NEXT_PUBLIC_APP_VERSION=${{ env.VERSION }}
          tags: |-
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: false

  publish-runtime-images:
    name: Ensure Redis and MinIO are on GHCR
    needs: [prepare, preflight-server]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The server cannot reach Docker Hub, so these images are served from GHCR.
      # They are copied once; later deploys reuse them and never depend on Docker Hub.
      - name: Copy missing images into GHCR
        shell: bash
        run: |
          set -euo pipefail
          mirror() {
            local source="$1" target="$2"
            if docker buildx imagetools inspect "$target" >/dev/null 2>&1; then
              echo "DESKA_DEPLOY_STAGE: ${target} already on GHCR"
              return 0
            fi
            for attempt in 1 2 3; do
              if docker pull "$source" && docker tag "$source" "$target" && docker push "$target"; then
                return 0
              fi
              sleep $((attempt * 15))
            done
            echo "DESKA_DEPLOY_ERROR: could not copy ${source} to GHCR."
            return 1
          }
          mirror redis:7-alpine "${IMAGE_PREFIX}/redis:7-alpine"
          mirror quay.io/minio/minio:latest "${IMAGE_PREFIX}/minio:latest"

  deploy:
    name: Deploy on server
    needs: [prepare, preflight-server, build-images, publish-runtime-images]
    runs-on: ubuntu-24.04
    # Backups and registry pulls have their own bounded timeouts. Keep the job
    # envelope larger than their sum so GitHub never kills a healthy rollback.
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Install server host key
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" |
            bash deploy/prepare-known-hosts.sh "$SERVER_HOST" "$SERVER_PORT" "$HOME/.ssh/known_hosts"

      - name: Upload deployment files
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/deska-deploy-${VERSION}"
          mkdir -p "$bundle/deploy/postgres"
          cp docker-compose.yml "$bundle/.deska-compose-${VERSION}.yml"
          cp deploy/server-deploy.sh "$bundle/.deska-server-deploy-${VERSION}.sh"
          cp deploy/postgres/pg_hba.conf deploy/postgres/replica-entrypoint.sh "$bundle/deploy/postgres/"
          (cd "$bundle" && sha256sum ".deska-compose-${VERSION}.yml" ".deska-server-deploy-${VERSION}.sh" > ".deska-deploy-${VERSION}.sha256")
          # One archive over one SSH connection. Docker may have turned a missing
          # bind-mount source into a directory; remove such directories first.
          for attempt in 1 2 3; do
            if tar -C "$bundle" -czf - ".deska-compose-${VERSION}.yml" ".deska-server-deploy-${VERSION}.sh" ".deska-deploy-${VERSION}.sha256" deploy/postgres/pg_hba.conf deploy/postgres/replica-entrypoint.sh |
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
                "set -e; cd '$DEPLOY_PATH'; for p in deploy/postgres/pg_hba.conf deploy/postgres/replica-entrypoint.sh; do if [ -d \"\$p\" ]; then rm -rf -- \"\$p\"; fi; done; tar -xzf - --no-same-owner"; then
              echo "DESKA_DEPLOY_STAGE: deployment files uploaded"
              exit 0
            fi
            echo "DESKA_DEPLOY_STAGE: upload failed (attempt ${attempt}/3); retrying..."
            sleep $((attempt * 15))
          done
          echo 'DESKA_DEPLOY_ERROR: could not upload deployment files after 3 attempts.'
          exit 1

      - name: Deploy and verify on server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          # The short-lived registry token travels over SSH stdin and is never
          # embedded in a command, workflow log, server file, or compose file.
          printf '%s\n%s\n%s\n%s\n%s\n' "$REGISTRY_TOKEN" "$REGISTRY_USER" "$DEPLOY_PATH" "$VERSION" "$IMAGE_PREFIX" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=60 -o ServerAliveInterval=20 -o ServerAliveCountMax=6 -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" '
              IFS= read -r registry_token
              IFS= read -r registry_user
              IFS= read -r deploy_path
              IFS= read -r version
              IFS= read -r image_prefix
              logged_in=0
              for attempt in 1 2 3; do
                if printf "%s" "$registry_token" | docker login ghcr.io -u "$registry_user" --password-stdin >/dev/null 2>/tmp/deska-docker-login.err; then
                  logged_in=1
                  break
                fi
                sleep $((attempt * 10))
              done
              if [ "$logged_in" -ne 1 ]; then
                echo "DESKA_DEPLOY_ERROR: server could not sign in to ghcr.io."
                sed -n "1,20p" /tmp/deska-docker-login.err | sed "s/gh[ps]_[A-Za-z0-9]*/[REDACTED]/g; s/github_pat_[A-Za-z0-9_]*/[REDACTED]/g"
                rm -f /tmp/deska-docker-login.err
                exit 1
              fi
              rm -f /tmp/deska-docker-login.err
              unset registry_token
              trap "docker logout ghcr.io >/dev/null 2>&1 || true" EXIT
              cd "$deploy_path"
              DEPLOY_PATH="$deploy_path" VERSION="$version" IMAGE_PREFIX="$image_prefix" bash "$deploy_path/.deska-server-deploy-${version}.sh"
            '
