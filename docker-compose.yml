name: deska-news

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - hot_standby=on
      - -c
      - max_wal_senders=3
      - -c
      - max_replication_slots=3
      - -c
      - hba_file=/etc/deska/pg_hba.conf
    environment:
      POSTGRES_USER: deska
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: deska_news
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/pg_hba.conf:/etc/deska/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deska -d deska_news"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica-bootstrap:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-replicator-secret}
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -h postgres -U deska -d deska_news -v ON_ERROR_STOP=1 <<SQL
        DO \$\$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'replicator') THEN
            CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD '${REPLICATOR_PASSWORD:-replicator-secret}';
          END IF;
        END
        \$\$;
        SQL

  postgres-replica:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: ${REPLICATOR_PASSWORD:-replicator-secret}
      POSTGRES_PASSWORD: ${REPLICATOR_PASSWORD:-replicator-secret}
    entrypoint: ["sh", "/replica-entrypoint.sh"]
    volumes:
      - postgres_replica:/var/lib/postgresql/data
      - ./deploy/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - ./deploy/postgres/pg_hba.conf:/etc/deska/pg_hba.conf:ro
    depends_on:
      postgres-replica-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deska -d deska_news"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-deska}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-deska-minio-secret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/data

  # A named Docker volume is mounted after the image is built, so the chown
  # performed in the Dockerfile does not apply to a newly created volume.
  # Prepare it as root once before the non-root API process starts.
  api-storage-init:
    image: ${IMAGE_PREFIX:-deskanews}/api:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /app/uploads && chown -R 1001:1001 /app/uploads"]
    volumes:
      - api_uploads:/app/uploads

  api:
    image: ${IMAGE_PREFIX:-deskanews}/api:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://deska:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/deska_news
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY must be set}
      SETTINGS_ENCRYPTION_KEY_PREVIOUS: ${SETTINGS_ENCRYPTION_KEY_PREVIOUS:-}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      APP_VERSION: ${APP_VERSION:-1.0.0}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      PORT: 3001
      TENANT_MODE: multi
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      STORAGE_PATH: /app/uploads
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-deska}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-deska}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-deska-minio-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      DATABASE_REPLICA_URL: postgresql://deska:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres-replica:5432/deska_news
      DESKA_PROCESS_ROLE: api
      DESKA_BACKGROUND_JOBS_ENABLED: "false"
      REDIS_URL: redis://redis:6379
      NEWS_BROWSER_RENDERING: "false"
      CHROMIUM_EXECUTABLE_PATH: ${CHROMIUM_EXECUTABLE_PATH:-/usr/bin/chromium-browser}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@deska.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      api-storage-init:
        condition: service_completed_successfully

  api-worker:
    image: ${IMAGE_PREFIX:-deskanews}/api:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://deska:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/deska_news
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY must be set}
      SETTINGS_ENCRYPTION_KEY_PREVIOUS: ${SETTINGS_ENCRYPTION_KEY_PREVIOUS:-}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set}
      PORT: 3001
      TENANT_MODE: multi
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      STORAGE_PATH: /app/uploads
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-deska}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-deska}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-deska-minio-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      DATABASE_REPLICA_URL: postgresql://deska:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres-replica:5432/deska_news
      DESKA_PROCESS_ROLE: worker
      DESKA_BACKGROUND_JOBS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      NEWS_BROWSER_RENDERING: ${NEWS_BROWSER_RENDERING:-true}
      CHROMIUM_EXECUTABLE_PATH: ${CHROMIUM_EXECUTABLE_PATH:-/usr/bin/chromium-browser}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      api-storage-init:
        condition: service_completed_successfully

  web:
    image: ${IMAGE_PREFIX:-deskanews}/web:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3001
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-1.0.0}
        NEXT_PUBLIC_BASE_PATH: ${BASE_PATH:-}
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      API_URL: http://api:3001
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-1.0.0}
      NEXT_PUBLIC_BASE_PATH: ${BASE_PATH:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_replica:
  api_uploads:
  minio_data:
